# ==========================================
# EverWar - Конфигурация
# ==========================================

# Язык: ru или en
language: "ru"

# Клан
clan:
  # Минимальное название клана
  min-name-length: 3
  # Максимальное название клана
  max-name-length: 24
  # Длина тега клана
  tag-length: 4
  # Максимум участников в клане
  max-members: 50
  # Стоимость создания клана (если Vault подключен)
  create-cost: 10000.0

# Территории
territory:
  # Максимум чанков на игрока
  chunks-per-player: 3
  # Максимум чанков всего
  max-chunks: 150
  # Стоимость захвата чанка
  claim-cost: 500.0

# Война
war:
  # Время подготовки (в секундах)
  preparation-time: 600
  # Длительность войны (в секундах, 0 = бесконечно)
  duration: 0
  # Минимум участников для объявления войны
  min-players: 3
  # Очки за убийство
  kill-points: 10
  # Очки за захват территории
  capture-points: 50

# Осада
siege:
  # Время удержания точки (в секундах)
  capture-time: 300
  # Радиус точки осады (в блоках)
  radius: 10
  # Стоимость начала осады
  cost: 2000.0

# Снабжение
supply:
  # Еда на войну
  food-per-war: 100
  # Материалы на войну
  materials-per-war: 50

# Базы
base:
  # HP ядра базы
  core-hp: 1000
  # Стоимость укрепления
  upgrade-cost: 5000.0

# Очки мощи
power:
  # Начальные очки игрока
  starting-power: 100
  # Очки за убийство
  kill-power: 5
  # Потеря очков при смерти
  death-power: 3
  # Максимум очков
  max-power: 10000

# Сообщения
messages:
  # Показывать в чате
  broadcast-war: true
  broadcast-siege: true
  broadcast-alliance: true

# Защита
protection:
  # Защита от PvP на своей территории
  friendly-fire: false
  # Защита от взрыва на своей территории
  explosion-protection: true